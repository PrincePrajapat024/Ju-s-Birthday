<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Jyoti! 🎉</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fff0f5 0%, #f0f4ff 100%);
      overflow-x: hidden;
    }

    .heading-font { 
      font-family: 'Playfair Display', serif; 
    }

    .balloon {
      position: absolute;
      font-size: 3.5rem;
      animation: float 14s linear infinite;
      z-index: 0;
      opacity: 0.9;
    }

    @keyframes float {
      0% { transform: translateY(110vh) rotate(0deg); }
      100% { transform: translateY(-100vh) rotate(360deg); }
    }

    .polaroid {
      background: white;
      padding: 12px;
      box-shadow: 0 15px 25px rgba(0,0,0,0.15);
      transition: all 0.4s ease;
      border: 8px solid white;
    }

    .polaroid:hover {
      transform: scale(1.08) rotate(0deg) !important;
      box-shadow: 0 25px 35px rgba(0,0,0,0.2);
    }

    .music-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 50;
      width: 65px;
      height: 65px;
      background: linear-gradient(135deg, #ff9ec3, #c79fff);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.1rem;
      box-shadow: 0 10px 25px rgba(255, 105, 180, 0.4);
      border: 4px solid white;
      transition: all 0.3s;
    }

    .music-btn.playing {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      50% { transform: scale(1.15); }
    }

    .start-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #fce7f3, #e0f2fe);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1.2s ease;
    }
  </style>
</head>
<body class="min-h-screen relative">

  <!-- Start Overlay (This will start music automatically on click) -->
  <div id="startOverlay" class="start-overlay">
    <div class="text-center px-6">
      <h1 class="text-6xl md:text-7xl heading-font font-bold text-pink-600 mb-6">
        Dear Bhulakkad ✨
      </h1>
      <p class="text-3xl text-purple-600 mb-12 font-medium">It's your special day...</p>
      
      <button onclick="startCelebration()" 
        class="px-14 py-6 bg-gradient-to-r from-pink-500 to-purple-500 text-white text-2xl font-semibold rounded-3xl shadow-2xl hover:scale-110 transition-all duration-300">
        Ye button daba 🎉
      </button>
      
      
    </div>
  </div>

  <!-- Floating Balloons -->
  <div id="balloons" class="fixed inset-0 pointer-events-none z-10"></div>

  <!-- Hero Section -->
  <section class="min-h-screen flex items-center justify-center relative overflow-hidden">
    <div class="text-center z-20 px-6 pt-10">
      <h1 class="text-6xl md:text-8xl font-bold heading-font text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-500 mb-4">
        Happy Birthday
      </h1>
      <h2 class="text-5xl md:text-7xl font-bold heading-font text-pink-600 mb-8">
        Jyoti! 🎉
      </h2>
      
      <button onclick="launchSurprise()" 
        class="px-10 py-5 bg-gradient-to-r from-pink-500 to-purple-500 text-white text-2xl font-semibold rounded-3xl shadow-2xl hover:scale-110 transition-all duration-300">
        Aab ye wala daba 🎂
      </button>
	
    </div>
  </section>

  

 
  <!-- Music Control Button -->
  <button id="musicBtn" onclick="toggleMusic()" class="music-btn">
    ♪
  </button>

  <!-- Surprise Modal -->
  <div id="surpriseModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="modal bg-white rounded-3xl max-w-lg w-full mx-4 p-10 text-center shadow-2xl">
      <div class="text-6xl mb-6">🎂✨🎉</div>
      <h3 class="text-4xl font-bold text-pink-600 heading-font mb-6">Happy Birthday Ju!</h3>
      <p class="text-xl text-gray-700 leading-relaxed">
        Baatein bhulne ki tukjhe purani beemari hai , lekin teri dosti sabse suhani hai .<br><br>
        Chahe kitna bhi bhulakkad ho jaaye, main hamesha tera dost hoon.<br><br>
        <span class="text-2xl font-semibold text-purple-600">Stay crazy, stay beautiful, stay crazy.</span>
      </p>
      <button onclick="closeModal()" class="mt-10 px-10 py-4 bg-gradient-to-r from-pink-500 to-purple-500 text-white rounded-2xl text-lg font-semibold">
        Close with a smile 💕
      </button>
    </div>
  </div>

  <!-- Your Local Music -->
  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script>
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    let isPlaying = false;

    function startCelebration() {
      const overlay = document.getElementById('startOverlay');
      overlay.style.opacity = '0';
      
      setTimeout(() => {
        overlay.style.display = 'none';
        
        // Start Music Automatically
        music.play().catch(() => {
          console.log("Autoplay blocked, user can use music button");
        });
        
        isPlaying = true;
        musicBtn.classList.add('playing');
        musicBtn.textContent = '♪';
        
        createBalloons();
        launchConfetti();
      }, 800);
    }

    function toggleMusic() {
      if (isPlaying) {
        music.pause();
        musicBtn.classList.remove('playing');
        musicBtn.textContent = '♫';
      } else {
        music.play();
        musicBtn.classList.add('playing');
        musicBtn.textContent = '♪';
      }
      isPlaying = !isPlaying;
    }

    function createBalloons() {
      const container = document.getElementById('balloons');
      const emojis = ['🎈', '🌸', '🦋', '🍭', '✨', '🪩'];
      for (let i = 0; i < 20; i++) {
        const b = document.createElement('div');
        b.className = 'balloon';
        b.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        b.style.left = Math.random() * 100 + 'vw';
        b.style.animationDuration = (Math.random() * 12 + 14) + 's';
        b.style.animationDelay = '-' + Math.random() * 25 + 's';
        container.appendChild(b);
      }
    }

    function launchConfetti() {
      const colors = ['#f472b6', '#c084fc', '#67e8f9', '#a5f3fc', '#fde047'];
      confetti({ particleCount: 200, spread: 90, origin: { y: 0.6 }, colors: colors });
    }

    function launchSurprise() {
      launchConfetti();
      document.getElementById('surpriseModal').classList.remove('hidden');
      document.getElementById('surpriseModal').classList.add('flex');
      setTimeout(launchConfetti, 600);
      setTimeout(launchConfetti, 1300);
    }

    function closeModal() {
      const modal = document.getElementById('surpriseModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Keyboard shortcut (just in case)
    document.addEventListener('keydown', (e) => {
      if (e.key === "m" || e.key === "M") toggleMusic();
    });
  </script>
</body>
</html>
